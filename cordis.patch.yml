# dsh-llm-ferry: the Ferry server's models in DSH, and the only way out to a model. Server and token come from
# ~/.ferry/config.json (ferry login) or FERRY_SERVER / FERRY_TOKEN; to set them here instead, add them under config.
- insert:
    - id: llm-ferry
      name: dsh-llm-ferry

# Every model request leaves through Ferry: DSH's direct model routes are switched off, so a request naming one of
# them fails ("no adapter") instead of going straight from this computer to a model. llm-ferry only borrows
# llm-pi-ai's code; it does not need that plugin mounted. To use a direct route again, set disabled: false for it
# in the profile's own cordis.patch.yml.
- id: llm-pi-ai
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true

- id: agent-default-model
  config:
    provider: ferry
    model: auto

# web_search through the server too (DeepSeek Search API with the server's key), when the server offers it; DSH's own
# DeepSeek search plugins would call DeepSeek from this computer with a key of its own, so they are off. Pages are
# still read on this computer (intranet pages too); choose ferry-fetch in the web settings to read public pages on
# the server instead.
- id: web
  config:
    searchProvider: ferry-search
    fetchProvider: http
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
